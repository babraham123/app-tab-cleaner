name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check store credentials; don't upload or submit
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm zip
      - run: pnpm zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zips
      - name: Attach zips to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --repo "$GITHUB_REPOSITORY" --generate-notes

  # Submits the exact zips that passed `check`. Secrets live in the `web-stores` environment;
  # add required reviewers there to gate each release. A store is skipped until its secrets exist.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: web-stores
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: zips
      - name: Submit to the Chrome Web Store and Firefox Add-ons
        env:
          # Not DRY_RUN: the submit tool reads that name itself.
          STORE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: '{a3961bff-1c64-40aa-a187-712c9c29a1cb}'
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          # The submit tool only targets stores whose zip is passed.
          args=()
          if [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then
            args+=(--chrome-zip zips/*-chrome.zip)
          else
            echo "::warning::Chrome Web Store secrets not set; skipping Chrome"
          fi
          if [ -n "$FIREFOX_JWT_SECRET" ]; then
            args+=(--firefox-zip zips/*-firefox.zip --firefox-sources-zip zips/*-sources.zip)
          else
            echo "::warning::Firefox Add-ons secrets not set; skipping Firefox"
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::No store secrets configured in the web-stores environment"
            exit 1
          fi
          if [ "$STORE_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          pnpm exec wxt submit "${args[@]}"
